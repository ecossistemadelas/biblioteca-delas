<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar | Biblioteca Delas</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #f8f5f1;
            --surface: #ffffff;
            --text: #292421;
            --muted: #766e68;
            --border: #e8e0da;
            --accent: #9b695c;
            --accent-dark: #765047;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);

        }

        .login-container {

            width: 100%;
            max-width: 420px;

        }

        .brand {

            text-align: center;
            margin-bottom: 32px;

        }

        .brand-name {

            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;

        }

        .brand-subtitle {

            margin-top: 8px;

            color: var(--muted);

            font-size: 14px;

        }

        .login-card {

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 34px;

            box-shadow:
                0 12px 35px rgba(50, 40, 35, 0.06);

        }

        .login-card h1 {

            font-size: 28px;

            line-height: 1.2;

            letter-spacing: -0.8px;

            margin-bottom: 10px;

        }

        .login-description {

            color: var(--muted);

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;

        }

        .field {

            margin-bottom: 18px;

        }

        .field label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 7px;

        }

        .field input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid var(--border);

            border-radius: 8px;

            background: #fff;

            color: var(--text);

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }

        .field input:focus {

            border-color: var(--accent);

            box-shadow:
                0 0 0 3px rgba(155, 105, 92, 0.10);

        }

        .login-button {

            width: 100%;

            border: none;

            border-radius: 8px;

            padding: 13px 16px;

            background: var(--accent-dark);

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;

        }

        .login-button:hover {

            opacity: 0.9;

        }

        .login-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }

        .message {

            display: none;

            margin-top: 18px;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.5;

        }

        .message.error {

            display: block;

            background: #f8eeee;

            color: #8a4545;

            border: 1px solid #ecd3d3;

        }

        .message.success {

            display: block;

            background: #eef6f0;

            color: #41694c;

            border: 1px solid #d5e7d9;

        }

        .back-link {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: var(--muted);

            font-size: 13px;

        }

        .back-link:hover {

            color: var(--text);

        }

        .premium-note {

            margin-top: 24px;

            padding-top: 20px;

            border-top: 1px solid var(--border);

            color: var(--muted);

            font-size: 12px;

            line-height: 1.5;

            text-align: center;

        }

    </style>

</head>


<body>

    <main class="login-container">

        <div class="brand">

            <div class="brand-name">
                Biblioteca Delas
            </div>

            <div class="brand-subtitle">
                Recursos para construir negócios com mais clareza.
            </div>

        </div>


        <section class="login-card">

            <h1>
                Entrar
            </h1>

            <p class="login-description">
                Acesse sua conta para utilizar os recursos
                Premium da Biblioteca Delas.
            </p>


            <form id="login-form">

                <div class="field">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="login-button"
                >
                    Entrar
                </button>


                <div
                    id="message"
                    class="message"
                ></div>

            </form>


            <div class="premium-note">

                Este acesso é destinado às participantes
                com acesso Premium.

            </div>

        </section>


        <a
            href="index.html"
            class="back-link"
        >
            ← Voltar para a Biblioteca

        </a>

    </main>


    <script>

        const form =
            document.getElementById("login-form");

        const button =
            document.getElementById("login-button");

        const message =
            document.getElementById("message");


        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                if (!email || !password) {

                    showMessage(
                        "Preencha seu e-mail e sua senha.",
                        "error"
                    );

                    return;

                }

                showMessage(
                    "A tela de login está funcionando. A conexão com o acesso Premium será configurada na próxima etapa.",
                    "success"
                );

            }
        );


        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }

    </script>

</body>

</html>
